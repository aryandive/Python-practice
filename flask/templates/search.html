{% extends 'base.html' %}

{% block title %}Search Demo{% endblock %}

{% block content %}
<section class="container">
  <h2>Query parameter demo</h2>
  <form action="{{ url_for('search') }}" method="get">
    <input name="q" placeholder="search term" value="{{ q }}">
    <button class="btn" type="submit">Search</button>
  </form>

  {% if q %}
    <h3>Results for "{{ q }}"</h3>
    <ul>
      {% for r in results %}
      <li>{{ r }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</section>
{% endblock %}
